apiVersion: argoproj.io/v1alpha1 
kind: Application
metadata:
  name: argocd-application 
  namespace: argocd 
spec:
  project: default 
  source: 
    repoURL: https://github.com/Ismail-1630672/EKS-project.git 
    targetRevision: HEAD 
    path: kubernetes/deployments 
    
      
  destination: 
    server: https://kubernetes.default.svc 
    namespace: default  
  
  
  syncPolicy:
    automated: 
      enabled: true 
      prune: true 
      selfHeal: true  
    syncOptions:
    - CreateNameSpace=true 